[workspace]
resolver = "3"
members = ["crates/wahoo", "crates/wahoo-cli", "crates/wahoo-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/toniferr/wahoo"
authors = ["Antonio Ferreiro"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
